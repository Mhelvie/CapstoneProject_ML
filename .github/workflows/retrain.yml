name: Continuous Retraining & Forecast Pipeline

on:
  schedule:
    # Trigger at 00:00 UTC on the 1st day of every month
    - cron: '0 0 1 * *'
  workflow_dispatch:
    # Enable manual execution button in the GitHub Actions UI
    inputs:
      force_retrain:
        description: 'Force model retraining and forecast sync'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  retrain-and-sync:
    name: Retrain Models & Sync Forecast
    runs-on: ubuntu-latest

    env:
      LARAVEL_API_URL: ${{ secrets.LARAVEL_API_URL || 'https://campfreedive.ph/api/v1/ml' }}
      ML_TOKEN: ${{ secrets.ML_TOKEN || 'cfml_live_8eef173d6b5670cab3ec93d7ae53736a4128e079484c718819f20625' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Retraining Pipeline
        run: |
          python retrain_pipeline.py

      - name: Run Automated Test & Smoke Checks
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Upload Forecast & Model Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ml-forecast-and-models
          path: |
            outputs/forecast.csv
            outputs/models/*.joblib
            outputs/featured_dataset.csv
          retention-days: 30

      - name: Commit & Push Updated Model Weights & Forecast
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add outputs/forecast.csv outputs/models/*.joblib
          
          if git diff --staged --quiet; then
            echo "No changes in model artifacts or forecasts to commit."
          else
            git commit -m "chore(ml): automated continuous retraining and 90-day forecast update [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
